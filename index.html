<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Моя учебная доска</title>
  <style>
    body { margin: 0; overflow: hidden; background: #ffffff; font-family: sans-serif; }
    body.grid-bg {
      background-image: 
        linear-gradient(to right, #e5e9f0 1px, transparent 1px),
        linear-gradient(to bottom, #e5e9f0 1px, transparent 1px);
      background-size: 25px 25px;
    }
    #toolbar {
      position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
      background: #ffffff; padding: 7px 12px; border-radius: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.12); display: flex; gap: 6px; 
      align-items: center; z-index: 100; border: 1px solid #eee; flex-wrap: wrap; max-width: 95vw;
    }
    .btn {
      cursor: pointer; padding: 6px 10px; border-radius: 8px; border: 1px solid #ddd;
      background: #f8f9fa; font-size: 13px; font-weight: 500;
    }
    .btn:hover { background: #e9ecef; }
    .btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .color-dot {
      width: 20px; height: 20px; border-radius: 50%; border: 2px solid #fff;
      box-shadow: 0 0 0 1px #ccc; cursor: pointer;
    }
    .color-dot.selected { box-shadow: 0 0 0 2px #2563eb; transform: scale(1.15); }
    .divider { width: 1px; height: 20px; background: #ddd; margin: 0 2px; }
    canvas { display: block; touch-action: none; cursor: crosshair; }
    #status {
      position: fixed; bottom: 10px; right: 14px; font-size: 12px;
      color: #666; background: rgba(255,255,255,0.9); padding: 4px 10px; border-radius: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }
  </style>
</head>
<body class="grid-bg">

  <div id="toolbar">
    <button class="btn" id="prevPage">◀</button>
    <span id="pageLabel" style="font-size:13px; font-weight:bold; min-width:55px; text-align:center;">Лист 1</span>
    <button class="btn" id="nextPage">▶</button>

    <div class="divider"></div>

    <div class="color-dot selected" data-color="#111111" style="background:#111111;"></div>
    <div class="color-dot" data-color="#2563eb" style="background:#2563eb;"></div>
    <div class="color-dot" data-color="#dc2626" style="background:#dc2626;"></div>
    <div class="color-dot" data-color="#16a34a" style="background:#16a34a;"></div>

    <div class="divider"></div>

    <button class="btn active" id="btn-pen">🖊️ Ручка</button>
    <button class="btn" id="btn-eraser">🧽 Ластик</button>
    <button class="btn" id="btn-text">🔤 Текст</button>
    <input type="range" id="size" min="2" max="15" value="3" style="width:55px;" title="Толщина">

    <div class="divider"></div>

    <button class="btn" id="btn-img" title="Загрузить скриншот из ВК Доски">📥 Фото / ВК</button>
    <input type="file" id="imgInput" accept="image/*" style="display:none">
    <button class="btn" id="btn-grid">📏 Клетка</button>
    <button class="btn" id="btn-clear" style="color:#dc2626;" title="Очистить текущий лист">🗑️ Очистить</button>
  </div>

  <div id="status">🟡 Подключение...</div>
  <canvas id="board"></canvas>

  <script src="https://jsdelivr.net"></script>
  <script>
    const SUPABASE_URL = 'https://supabase.co';
    const SUPABASE_KEY = 'sb_publishable_JUw8Aecn4rGBh_pnV5XC_A_7b0PoF4r';

    const canvas = document.getElementById('board');
    const ctx = canvas.getContext('2d');
    const sizePicker = document.getElementById('size');
    const statusEl = document.getElementById('status');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let currentPage = 1;
    let drawing = false, mode = 'pen', currentColor = '#111111', lastX = 0, lastY = 0;

    // Кнопки работают сразу, независимо от сети
    function setMode(newMode) {
      mode = newMode;
      document.querySelectorAll('#toolbar .btn').forEach(b => b.classList.remove('active'));
      if (newMode === 'pen') document.getElementById('btn-pen').classList.add('active');
      if (newMode === 'eraser') document.getElementById('btn-eraser').classList.add('active');
      if (newMode === 'text') document.getElementById('btn-text').classList.add('active');
      canvas.style.cursor = newMode === 'text' ? 'text' : 'crosshair';
    }

    document.getElementById('btn-pen').onclick = () => setMode('pen');
    document.getElementById('btn-eraser').onclick = () => setMode('eraser');
    document.getElementById('btn-text').onclick = () => setMode('text');
    document.getElementById('btn-grid').onclick = () => document.body.classList.toggle('grid-bg');
    document.getElementById('btn-img').onclick = () => document.getElementById('imgInput').click();

    document.querySelectorAll('.color-dot').forEach(dot => {
      dot.onclick = () => {
        currentColor = dot.dataset.color;
        setMode('pen');
        document.querySelectorAll('.color-dot').forEach(d => d.classList.remove('selected'));
        dot.classList.add('selected');
      };
    });

    function renderItem(d) {
      if (!d) return;
      if (d.type === 'line') {
        ctx.save();
        if (d.isEraser) {
          ctx.globalCompositeOperation = 'destination-out';
          ctx.lineWidth = 28;
        } else {
          ctx.globalCompositeOperation = 'source-over';
          ctx.strokeStyle = d.color;
          ctx.lineWidth = d.size;
        }
        ctx.beginPath();
        ctx.moveTo(d.x0, d.y0);
        ctx.lineTo(d.x1, d.y1);
        ctx.lineCap = 'round';
        ctx.stroke();
        ctx.restore();
      } else if (d.type === 'text') {
        ctx.font = '20px sans-serif';
        ctx.fillStyle = d.color;
        ctx.fillText(d.text, d.x, d.y);
      } else if (d.type === 'img') {
        const img = new Image();
        img.onload = () => {
          const maxW = canvas.width * 0.85;
          const scale = img.width > maxW ? maxW / img.width : 1;
          ctx.drawImage(img, d.x, d.y, img.width * scale, img.height * scale);
        };
        img.src = d.src;
      }
    }

    // Подключаем базу Supabase
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadPage(pageNum) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const { data, error } = await sb
        .from('strokes')
        .select('data')
        .eq('page', pageNum)
        .order('id', { ascending: true });

      if (!error && data) {
        statusEl.innerText = '🟢 В сети (сохраняется в облако)';
        data.forEach(row => renderItem(row.data));
      } else {
        statusEl.innerText = '⚠️ Ошибка сети (проверьте интернет)';
      }
    }

    // Слушаем новые штрихи от собеседника в реальном времени
    sb.channel('board-live')
      .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'strokes' }, (payload) => {
        if (payload.new.page === currentPage) {
          renderItem(payload.new.data);
        }
      })
      .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'strokes' }, () => {
        loadPage(currentPage);
      })
      .subscribe((status) => {
        if (status === 'SUBSCRIBED') statusEl.innerText = '🟢 В сети (живой режим)';
      });

    async function sendItem(item) {
      renderItem(item);
      await sb.from('strokes').insert({ page: currentPage, data: item });
    }

    document.getElementById('prevPage').onclick = () => {
      if (currentPage <= 1) return;
      currentPage--;
      document.getElementById('pageLabel').innerText = 'Лист ' + currentPage;
      loadPage(currentPage);
    };

    document.getElementById('nextPage').onclick = () => {
      currentPage++;
      document.getElementById('pageLabel').innerText = 'Лист ' + currentPage;
      loadPage(currentPage);
    };

    document.getElementById('imgInput').onchange = (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => sendItem({ type: 'img', src: ev.target.result, x: 40, y: 70 });
      reader.readAsDataURL(file);
    };

    window.addEventListener('paste', (e) => {
      const item = Array.from(e.clipboardData.items).find(i => i.type.startsWith('image'));
      if (item) {
        const reader = new FileReader();
        reader.onload = (ev) => sendItem({ type: 'img', src: ev.target.result, x: 40, y: 70 });
        reader.readAsDataURL(item.getAsFile());
      }
    });

    canvas.addEventListener('pointerdown', (e) => {
      if (mode === 'text') {
        const text = prompt('Введите текст:');
        if (text) sendItem({ type: 'text', text, x: e.clientX, y: e.clientY, color: currentColor });
        return;
      }
      drawing = true; lastX = e.clientX; lastY = e.clientY;
    });

    canvas.addEventListener('pointermove', (e) => {
      if (!drawing) return;
      sendItem({
        type: 'line', x0: lastX, y0: lastY, x1: e.clientX, y1: e.clientY,
        color: currentColor, size: sizePicker.value, isEraser: mode === 'eraser'
      });
      lastX = e.clientX; lastY = e.clientY;
    });

    canvas.addEventListener('pointerup', () => drawing = false);
    canvas.addEventListener('pointerout', () => drawing = false);

    document.getElementById('btn-clear').onclick = async () => {
      if (confirm('Очистить текущий лист для всех?')) {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        await sb.from('strokes').delete().eq('page', currentPage);
      }
    };

    loadPage(1);
  </script>
</body>
</html>
